[project]
name = "meme-mirror"
version = "0.1.0"
description = "Real-time CV plugin that retrieves memes matching your face"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9",
    "mediapipe>=0.10",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]